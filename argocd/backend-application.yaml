apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-manager-backend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/opsbyNikhil/task-manager-k8s.git
    targetRevision: dev
    path: backend

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true